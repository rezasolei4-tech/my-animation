<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>انیمیشن مدرسه</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            display: flex; justify-content: center; align-items: center;
            font-family: Tahoma, sans-serif;
        }
        #animation-canvas { display: block; max-width: 100%; max-height: 100%; }
        
        #start-btn {
            position: absolute; z-index: 10;
            padding: 15px 40px; font-size: 20px; font-weight: bold;
            color: white; background: linear-gradient(145deg, #05a648, #06C755);
            border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <button id="start-btn">🎬 پخش انیمیشن</button>
    <canvas id="animation-canvas"></canvas>
    <audio id="bg-music" src="music.mp3" preload="auto"></audio>

    <script>
        const canvas = document.getElementById('animation-canvas');
        const ctx = canvas.getContext('2d');
        let bgImage = new Image();
        bgImage.src = 'background.jpg';

        const audio = document.getElementById('bg-music');
        const startBtn = document.getElementById('start-btn');

        let isPlaying = false;
        
        const lines = [
            "تهیه کننده : رضا سلیمانی",
            "مدرسه شجره میناب"
        ];

        // 🚨 مختصات دقیق
        const targetX = 1066; 
        const startY = 511; 
        const endY = 827;   

        let textYPositions = []; 

        // 🚨 سرعت حرکت متن (هر چی کمتر باشه آروم‌تره)
        const speed = 0.35; 

        bgImage.onload = () => {
            canvas.width = bgImage.width;
            canvas.height = bgImage.height;
            
            textYPositions = [startY, startY - 40]; 
            
            ctx.drawImage(bgImage, 0, 0); 
        };

        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            isPlaying = true;
            
            audio.play().catch(e => console.log("خطای پخش صدا:", e));
            animate();
        });

        function animate() {
            if (!isPlaying) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bgImage, 0, 0);

            const fontSize = canvas.width * 0.025; 

            lines.forEach((text, index) => {
                let alpha = 1;
                // افکت محو شدن در 150 پیکسل آخر
                if (textYPositions[index] > endY - 150) {
                    alpha = Math.max(0, (endY - textYPositions[index]) / 150);
                }

                drawTextOnDoor(text, targetX, textYPositions[index], fontSize, alpha);
                // اعمال سرعت جدید
                textYPositions[index] += speed; 
            });

            if (textYPositions[1] > endY) {
                isPlaying = false; 
            } else {
                requestAnimationFrame(animate);
            }
        }

        function drawTextOnDoor(text, x, y, fontSize, alpha) {
            ctx.font = `bold ${fontSize}px Tahoma, Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            ctx.globalAlpha = alpha;

            ctx.shadowColor = "rgba(0, 0, 0, 1)";
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 4;
            ctx.shadowOffsetY = 4;

            ctx.fillStyle = "#FFD700"; 
            ctx.fillText(text, x, y);

            ctx.shadowColor = "transparent";
            ctx.globalAlpha = 1;
        }
    </script>
</body>
</html>
