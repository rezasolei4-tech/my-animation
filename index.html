<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>انیمیشن مدرسه</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            display: flex; justify-content: center; align-items: center;
            font-family: Tahoma, sans-serif;
        }
        #animation-canvas { display: block; max-width: 100%; max-height: 100%; }
        
        #start-btn {
            position: absolute; z-index: 10;
            padding: 15px 40px; font-size: 20px; font-weight: bold;
            color: white; background: linear-gradient(145deg, #05a648, #06C755);
            border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <button id="start-btn">🎬 پخش انیمیشن</button>
    <canvas id="animation-canvas"></canvas>
    <audio id="bg-music" src="music.mp3" preload="auto"></audio>

    <script>
        const canvas = document.getElementById('animation-canvas');
        const ctx = canvas.getContext('2d');
        let bgImage = new Image();
        bgImage.src = 'background.jpg';

        const audio = document.getElementById('bg-music');
        const startBtn = document.getElementById('start-btn');

        let isPlaying = false;
        
        const lines = [
            "تهیه کننده : رضا سلیمانی",
            "مدرسه شجره میناب"
        ];

        // 🚨 مختصات دقیق کادر صورتی روی در سمت راست
        // این اعداد رو از روی عکس شما تخمین زدم (نسبت به ابعاد اصلی عکس)
        const boxCenterX = 0.725; // وسط کادر صورتی به صورت افقی (72.5% عرض عکس)
        const boxStartY = 0.35;   // بالای کادر صورتی (35% ارتفاع عکس)
        const boxEndY = 0.75;     // پایین کادر صورتی (75% ارتفاع عکس)

        let textYPositions = []; 

        bgImage.onload = () => {
            canvas.width = bgImage.width;
            canvas.height = bgImage.height;
            
            // تنظیم موقعیت اولیه متن‌ها در بالای کادر صورتی
            const startYPixel = canvas.height * boxStartY;
            textYPositions = [startYPixel, startYPixel - (canvas.height * 0.05)]; // متن دوم کمی بالاتر
            
            ctx.drawImage(bgImage, 0, 0); 
        };

        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            isPlaying = true;
            
            audio.play().catch(e => console.log("خطای پخش صدا:", e));
            animate();
        });

        function animate() {
            if (!isPlaying) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bgImage, 0, 0);

            // محاسبه X دقیق (مرکز کادر)
            const textX = canvas.width * boxCenterX;
            const fontSize = canvas.width * 0.022; // سایز فونت متناسب با عرض در

            lines.forEach((text, index) => {
                drawTextOnDoor(text, textX, textYPositions[index], fontSize);
                // سرعت حرکت به پایین
                textYPositions[index] += 1.2; 
            });

            // 🚨 اگر متن دوم از پایین کادر صورتی عبور کرد، انیمیشن متوقف بشه
            const endYPixel = canvas.height * boxEndY;
            if (textYPositions[1] > endYPixel) {
                isPlaying = false; 
            } else {
                requestAnimationFrame(animate);
            }
        }

        function drawTextOnDoor(text, x, y, fontSize) {
            ctx.font = `bold ${fontSize}px Tahoma, Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            // سایه مشکی برای خوانایی
            ctx.shadowColor = "rgba(0, 0, 0, 1)";
            ctx.shadowBlur = 8;
            ctx.shadowOffsetX = 3;
            ctx.shadowOffsetY = 3;

            // رنگ متن: زرد طلایی
            ctx.fillStyle = "#FFD700"; 
            ctx.fillText(text, x, y);

            ctx.shadowColor = "transparent";
        }
    </script>
</body>
</html>
