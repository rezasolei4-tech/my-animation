<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>انیمیشن مدرسه</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
            display: flex; justify-content: center; align-items: center;
            font-family: Tahoma, sans-serif;
        }
        #animation-canvas { display: block; max-width: 100%; max-height: 100%; }
        
        #start-btn {
            position: absolute; z-index: 10;
            padding: 15px 40px; font-size: 20px; font-weight: bold;
            color: white; background: linear-gradient(145deg, #05a648, #06C755);
            border: none; border-radius: 50px; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <button id="start-btn">🎬 پخش انیمیشن</button>
    <canvas id="animation-canvas"></canvas>
    <audio id="bg-music" src="music.mp3" preload="auto"></audio>

    <script>
        const canvas = document.getElementById('animation-canvas');
        const ctx = canvas.getContext('2d');
        let bgImage = new Image();
        bgImage.src = 'background.jpg';

        const audio = document.getElementById('bg-music');
        const startBtn = document.getElementById('start-btn');

        let isPlaying = false;
        
        // متن‌هایی که قراره روی در مدرسه بیان
        const lines = [
            "تهیه کننده : رضا سلیمانی",
            "مدرسه شجره میناب"
        ];

        // 🚨 تنظیمات موقعیت در مدرسه (این اعداد رو بر اساس عکس تنظیم کردم)
        // اگر متن کمی چپ یا راست بود، عدد textX رو تغییر بده
        let textX = 0; // مقدار دقیق تر در تابع animate محاسبه میشه
        let startY = 0; // نقطه شروع روی در
        let endY = 0;   // نقطه پایان روی در
        
        // آرایه برای نگه داشتن موقعیت Y هر متن
        let currentYPositions = [];

        bgImage.onload = () => {
            canvas.width = bgImage.width;
            canvas.height = bgImage.height;
            
            // 🚨 تنظیم دقیق مختصات در مدرسه (نسبت به عرض و ارتفاع عکس)
            textX = canvas.width * 0.77; // روی در آبی سمت راست
            startY = canvas.height * 0.38; // از بالای در شروع بشه
            endY = canvas.height * 0.75;   // تا پایین در ادامه داشته باشه
            
            // تعیین موقعیت اولیه متن‌ها (بالای در)
            currentYPositions = [startY, startY - 60]; // متن دوم کمی بالاتر شروع میشه
            
            ctx.drawImage(bgImage, 0, 0); 
        };

        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            isPlaying = true;
            
            audio.play().catch(e => console.log("خطای پخش صدا:", e));
            animate();
        });

        function animate() {
            if (!isPlaying) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bgImage, 0, 0);

            const fontSize = canvas.width * 0.025; 

            lines.forEach((text, index) => {
                // رسم متن در موقعیت فعلی
                drawTextOnDoor(text, textX, currentYPositions[index], fontSize);
                
                // حرکت به سمت پایین
                currentYPositions[index] += 1.2; 
            });

            // 🚨 اگر متن آخر از پایین در عبور کرد، انیمیشن متوقف بشه
            if (currentYPositions[0] > endY) {
                isPlaying = false; 
            } else {
                requestAnimationFrame(animate);
            }
        }

        function drawTextOnDoor(text, x, y, fontSize) {
            ctx.font = `bold ${fontSize}px Tahoma, Arial`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            // سایه قوی برای خوانایی روی در
            ctx.shadowColor = "rgba(0, 0, 0, 1)";
            ctx.shadowBlur = 10;
            ctx.shadowOffsetX = 4;
            ctx.shadowOffsetY = 4;

            // رنگ متن: زرد طلایی
            ctx.fillStyle = "#FFD700"; 
            ctx.fillText(text, x, y);

            ctx.shadowColor = "transparent";
        }
    </script>
</body>
</html>
