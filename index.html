<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ابزار مختصات</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        #animation-canvas { display: block; max-width: 100%; max-height: 100%; }
        #info { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); color: #00ff00; padding: 10px; font-family: monospace; font-size: 14px; border-radius: 5px; z-index: 100; }
        #reset-btn { position: absolute; top: 10px; right: 10px; background: red; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; z-index: 100; font-weight: bold; }
    </style>
</head>
<body>
    <div id="info">روی عکس کلیک کنید</div>
    <button id="reset-btn" onclick="resetPoints()">پاک کردن</button>
    <canvas id="animation-canvas"></canvas>

    <script>
        const canvas = document.getElementById('animation-canvas');
        const ctx = canvas.getContext('2d');
        const info = document.getElementById('info');
        let bgImage = new Image();
        bgImage.src = 'background.jpg';

        let points = []; // آرایه‌ای برای ذخیره نقاط

        bgImage.onload = () => {
            canvas.width = bgImage.width;
            canvas.height = bgImage.height;
            draw();
        };

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(bgImage, 0, 0);

            // رسم دایره‌های قرمز روی نقاطی که کلیک شده
            ctx.fillStyle = 'red';
            points.forEach((p, index) => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 8, 0, Math.PI * 2);
                ctx.fill();
                
                // نوشتن مختصات کنار نقطه
                ctx.fillStyle = 'white';
                ctx.font = '20px Arial';
                ctx.fillText(`(${Math.round(p.x)}, ${Math.round(p.y)})`, p.x + 15, p.y + 5);
                ctx.fillStyle = 'red';
            });
        }

        // تشخیص کلیک یا لمس روی بوم
        canvas.addEventListener('pointerdown', (e) => {
            const rect = canvas.getBoundingClientRect();
            
            // محاسبه مختصات نسبت به ابعاد واقعی عکس (چون ممکنه بوم کوچیک شده باشه)
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            points.push({x: x, y: y});
            
            // نمایش مختصات به ترتیب کلیک
            let text = "مختصات کلیک شده:\n";
            points.forEach((p, i) => {
                text += `نقطه ${i+1}: X=${Math.round(p.x)}, Y=${Math.round(p.y)}\n`;
            });
            info.innerText = text;
            draw();
        });

        function resetPoints() {
            points = [];
            info.innerText = "روی عکس کلیک کنید";
            draw();
        }
    </script>
</body>
</html>
